services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nyc_data_db
    environment:
      POSTGRES_USER: nyc_user
      POSTGRES_PASSWORD: nyc_password
      POSTGRES_DB: nyc_urban_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyc_user -d nyc_urban_data"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
