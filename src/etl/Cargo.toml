[package]
name = "nyc_etl"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.29", features = ["rt-multi-thread", "macros", "fs"] }

# Database
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.12" }

# Data processing
parquet = { version = "53", features = ["arrow"] }
arrow = { version = "53" }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for downloading
reqwest = { version = "0.11", features = ["gzip", "brotli", "deflate", "stream", "json"] }
futures = "0.3"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress bar
indicatif = "0.17"

# Zip extraction
zip = "0.6"

# Bytes for streaming
bytes = "1.5"
